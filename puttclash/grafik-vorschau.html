<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puttclash · Grafik-Vorschau</title>
<!--
  PUTTCLASH · GRAFIK-VORSCHAU (grafik-vorschau.html)
  Nur zum Anschauen und Prüfen der Grafik (grafik.js) – kein Spiel, keine Physik.
  - Lädt bahnen.js (falls vorhanden), sonst die 6 eingebauten Beispielbahnen (je Platz eine).
    Beispielplätze, die bahnen.js noch nicht hat (z. B. piraten, vulkan), werden zusätzlich gezeigt.
  - So fügst du ein neues Thema zum Testen hinzu: zwischen BEISPIEL-START und BEISPIEL-ENDE einen
    Platz {id:'<thema>', name, emoji, bahnen:[{…}]} anlegen (id = Schlüssel in GRAFIK.THEMEN).
  - Oben die große Ansicht mit bewegten Objekten, Demo-Ball, Zielpfeil, zwei Geisterbällen.
  - Unten alle Bahnen als Kacheln (Name, par) – antippen zeigt sie groß.
  Bedienung große Ansicht: tippen = Ball hinsetzen (prüft bildZuFeld), vom Ball wegziehen
  = zielen, loslassen = Probeschuss (rollt nur geradeaus mit Reibung, ohne echte Physik).
-->
<link rel="stylesheet" href="../shared/theme.css">
<style>
 body{overflow:auto;height:auto;min-height:100%}
 .wrap{max-width:1180px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 40px}
 header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
 .buehne{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
 @media (max-width:820px){.buehne{grid-template-columns:minmax(0,1fr)}}
 #rahmen{position:relative;width:100%;height:min(76vh,860px);min-height:320px;border-radius:18px;overflow:hidden;background:#000;
   border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);touch-action:none}
 #rahmen canvas{display:block;width:100%;height:100%}
 .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
 .panel h3{margin:0 0 8px;font-family:var(--font-display);font-weight:400;font-size:18px;letter-spacing:.3px}
 .reihe{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
 .knopf{font-family:var(--font-display);font-size:15px;letter-spacing:.3px;padding:8px 12px;border-radius:12px;background:var(--surface-2);
   border:1px solid var(--line);box-shadow:0 3px 0 var(--shadow);min-height:40px}
 .knopf:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
 .knopf.an{background:var(--gold);color:#2A1700;border-color:var(--gold);box-shadow:0 3px 0 var(--gold-deep)}
 .klein{font-size:12.5px;line-height:1.45;margin:6px 0 0}
 #titel{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0}
 .zeile{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 10px}
 h2.sec{margin-top:26px}
 .kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
 .kachel{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left}
 .kachel.aktiv{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
 .kachel canvas{width:100%;aspect-ratio:2/3;border-radius:9px;display:block;background:#000}
 .kachel .n{font-weight:900;font-size:13.5px;line-height:1.2}
 .kachel .m{font-size:11.5px;color:var(--muted);font-weight:800}
 code{font-size:12px;color:var(--sky)}
</style>
</head>

  </div>
 </section>

 <div id="kachelBereich"></div>
</div>

/* Plätze aus bahnen.js haben Vorrang. Beispielplätze, deren id bahnen.js (noch) nicht kennt,
   werden hinten angehängt – so lassen sich neue Themen schon vor ihren echten Bahnen prüfen. */
const echt=typeof BAHNEN!=='undefined'&&BAHNEN&&Array.isArray(BAHNEN.PLAETZE)&&BAHNEN.PLAETZE.length>0;
const bekannt=new Set(echt?BAHNEN.PLAETZE.map(p=>p.id):[]);
const extra=BEISPIEL.filter(p=>!bekannt.has(p.id));
const PLAETZE=echt?BAHNEN.PLAETZE.concat(extra):BEISPIEL;
document.getElementById('quelle').textContent=!echt?'Beispielbahnen (bahnen.js fehlt)'
 :extra.length?'bahnen.js + Beispiel: '+extra.map(p=>p.id).join(', '):'Bahnen aus bahnen.js';

const $=id=>document.getElementById(id);
const rahmen=$('rahmen'),cv=$('gross'),ctx=cv.getContext('2d');
let wahl={platz:PLAETZE[0],bahn:PLAETZE[0].bahnen[0]};
let modus='auto',zielAn=true,geisterAn=true,pause=false,pauseBei=0,zeitVersatz=0;
let kam=null,cssB=0,cssH=0;
const ball={x:0,y:0,vx:0,vy:0,rollt:false,versenkt:false};
let spur=[],drag=null,letzterAbprall=0;

const zeit=()=>pause?pauseBei:performance.now()-zeitVersatz;
const randPunkte=b=>{const p=[];for(let i=0;i+1<b.rand.length;i+=2)p.push([b.rand[i],b.rand[i+1]]);return p};
function imPoly(x,y,p){let inn=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inn=!inn}return inn}
let rp=randPunkte(wahl.bahn);
const drin=(x,y)=>rp.length<3||imPoly(x,y,rp);

function ballZumStart(){const s=wahl.bahn.start||{x:500,y:1300};ball.x=s.x;ball.y=s.y;ball.vx=ball.vy=0;ball.rollt=false;ball.versenkt=false;spur=[]}
function waehle(platz,bahn){
 wahl={platz,bahn};rp=randPunkte(bahn);ballZumStart();kamNeu();
 $('titel').textContent=(platz.emoji||'')+' '+(bahn.name||bahn.id)+' · Par '+(bahn.par||'?');
 document.querySelectorAll('.kachel').forEach(k=>k.classList.toggle('aktiv',k.dataset.id===bahn.id));
}
function kamNeu(){
 const dreh=modus==='quer'||(modus==='auto'&&cssB>cssH*1.05);
 kam=GRAFIK.kamera(wahl.bahn,cssB,cssH,dreh);
 // Selbsttest: feldZuBild ↔ bildZuFeld
 let maxF=0;for(let i=0;i<50;i++){const x=Math.random()*1000,y=Math.random()*1500,p=kam.feldZuBild(x,y),q=kam.bildZuFeld(p[0],p[1]);maxF=Math.max(maxF,Math.abs(q[0]-x),Math.abs(q[1]-y))}
 $('pruef').textContent='Kamera: '+(dreh?'quer (gedreht)':'hochkant')+' · Skala '+kam.skala.toFixed(3)+' · Hin-und-zurück-Fehler '+maxF.toExponential(1);
}
function groesse(){
 const r=rahmen.getBoundingClientRect();cssB=Math.max(1,r.width);cssH=Math.max(1,r.height);
 const dpr=Math.min(window.devicePixelRatio||1,3);
 cv.width=Math.round(cssB*dpr);cv.height=Math.round(cssH*dpr);kamNeu();
}
if(window.ResizeObserver)new ResizeObserver(groesse).observe(rahmen);else window.addEventListener('resize',groesse);

/* ---------- Demo-Ball (keine Physik!) ---------- */
function autoWinkel(t){const l=wahl.bahn.loch||{x:500,y:200};return Math.atan2(l.y-ball.y,l.x-ball.x)+Math.sin(t*.001)*.35}
function schiesse(w,k){if(ball.rollt||ball.versenkt)return;const v=k*1700;ball.vx=Math.cos(w)*v;ball.vy=Math.sin(w)*v;ball.rollt=v>10;spur=[]}
function bewege(dt){
 if(ball.rollt){
  const n=4,h=dt/n;
  for(let i=0;i<n;i++){
   let nx=ball.x+ball.vx*h,ny=ball.y+ball.vy*h;
   if(!drin(nx,ny)){
    if(!drin(nx,ball.y))ball.vx*=-.7;
    if(!drin(ball.x,ny))ball.vy*=-.7;
    if(drin(nx,ny)===false&&drin(nx,ball.y)&&drin(ball.x,ny)){ball.vx*=-.7;ball.vy*=-.7}
    const now=performance.now();if(now-letzterAbprall>120){GRAFIK.effekt('funken',ball.x,ball.y);letzterAbprall=now}
    nx=ball.x;ny=ball.y;
   }
   ball.x=nx;ball.y=ny;
   const r=Math.exp(-1.1*h);ball.vx*=r;ball.vy*=r;
   const l=wahl.bahn.loch,sp=Math.hypot(ball.vx,ball.vy);
   if(l&&Math.hypot(ball.x-l.x,ball.y-l.y)<20&&sp<650){
    ball.rollt=false;ball.versenkt=true;GRAFIK.effekt('konfetti',l.x,l.y);
    setTimeout(ballZumStart,1600);break;
   }
   if(sp<14){ball.rollt=false;ball.vx=ball.vy=0;break}
  }
  spur.push([ball.x,ball.y]);if(spur.length>28)spur.shift();
 }else if(spur.length)spur.shift();
}

/* ---------- Bildschleife ---------- */
let alt=performance.now(),fz=0,ft=alt;
function bild(ms){
 const dt=Math.min(.05,(ms-alt)/1000);alt=ms;
 if(!pause)bewege(dt);
 const t=zeit(),b=wahl.bahn,L=b.loch||{x:500,y:250},S=b.start||{x:500,y:1300};
 const baelle=[];
 if(geisterAn){
  baelle.push({x:L.x+Math.cos(t*.0011)*110,y:L.y+170+Math.sin(t*.0017)*70,farbe:'#FF6B57',name:'Anna',geist:true});
  const u=.5+.5*Math.sin(t*.0006);
  baelle.push({x:S.x+(L.x-S.x)*u+Math.sin(t*.002)*60,y:S.y+(L.y-S.y)*u,farbe:'#3DDC97',name:'Ben',geist:true});
 }
 baelle.push({x:ball.x,y:ball.y,farbe:'#5BC0FF',name:'Ich',ich:true,versenkt:ball.versenkt});
 let ziel=null;
 if(zielAn&&!ball.rollt&&!ball.versenkt){
  ziel=drag?{von:{x:ball.x,y:ball.y},winkel:drag.winkel,kraft:drag.kraft}
           :{von:{x:ball.x,y:ball.y},winkel:autoWinkel(t),kraft:.5+.5*Math.sin(t*.0013)};
 }
 if(kam)GRAFIK.zeichne(ctx,b,wahl.platz.id,kam,{t,baelle,ziel,spur});
 fz++;if(ms-ft>500){$('fps').textContent=Math.round(fz*1000/(ms-ft))+' fps';fz=0;ft=ms}
 requestAnimationFrame(bild);
}

/* ---------- Eingabe ---------- */
function feldPunkt(e){const r=cv.getBoundingClientRect();return kam.bildZuFeld(e.clientX-r.left,e.clientY-r.top)}
cv.addEventListener('pointerdown',e=>{
 if(!kam)return;const p=feldPunkt(e);
 $('info').textContent='Feld '+Math.round(p[0])+' / '+Math.round(p[1]);
 if(ball.rollt||ball.versenkt)return;
 if(Math.hypot(p[0]-ball.x,p[1]-ball.y)<70){drag={winkel:0,kraft:0};cv.setPointerCapture(e.pointerId)}
 else if(drin(p[0],p[1])){ball.x=p[0];ball.y=p[1];spur=[]}
 else GRAFIK.effekt('funken',p[0],p[1]);
});
cv.addEventListener('pointermove',e=>{
 if(!drag||!kam)return;const p=feldPunkt(e),dx=ball.x-p[0],dy=ball.y-p[1];
 drag.winkel=Math.atan2(dy,dx);drag.kraft=Math.min(1,Math.hypot(dx,dy)/260);
});
const loslassen=()=>{if(!drag)return;const d=drag;drag=null;if(d.kraft>.04)schiesse(d.winkel,d.kraft)};
cv.addEventListener('pointerup',loslassen);cv.addEventListener('pointercancel',()=>{drag=null});

 };

/* ---------- Kacheln (einmal gezeichnet, t = 0) ---------- */
const bereich=$('kachelBereich'),warte=[];
PLAETZE.forEach(platz=>{
 const h=document.createElement('h2');h.className='sec';
 h.innerHTML='<span></span><small></small>';
 h.firstChild.textContent=(platz.emoji||'')+' '+(platz.name||platz.id);

 bereich.appendChild(h);

 (platz.bahnen||[]).forEach((bahn,i)=>{

  warte.push(()=>{
   const r=c.getBoundingClientRect(),b=Math.max(60,r.width),hh=b*1.5,dpr=Math.min(window.devicePixelRatio||1,2);
   c.width=Math.round(b*dpr);c.height=Math.round(hh*dpr);

  });
 });
});
